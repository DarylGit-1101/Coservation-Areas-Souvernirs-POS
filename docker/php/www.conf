[www]
; Tuned PHP-FPM pool for concurrent POS checkouts, offline sync bursts, and Filament admin
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
pm.process_idle_timeout = 10s

; Keep container environment variables available to PHP workers
clear_env = no

; Lightweight FPM status endpoint (internal only)
pm.status_path = /fpm-status
